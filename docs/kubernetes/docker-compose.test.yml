version: '3.9'

# ── Containerised test runner ─────────────────────────────────────────────────
# Spins up an ephemeral Redis and runs the full test suite inside a container.
#
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
#   docker compose -f docker-compose.test.yml down -v

services:

  redis-test:
    image: redis:7-alpine
    # tmpfs keeps Redis state in RAM — faster and isolated per test run
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.api
      # Use the 'builder' stage so devDependencies (mocha, chai, tsx) are present
      target: builder
    command: npm test
    environment:
      NODE_ENV: test
      REDIS_URL: redis://redis-test:6379
      SERVICE_NAME: slavery-test
    depends_on:
      redis-test:
        condition: service_healthy
    # Mount test-results out for CI artifact upload
    volumes:
      - ./test-results:/app/test-results
