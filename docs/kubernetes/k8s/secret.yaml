apiVersion: v1
kind: Secret
metadata:
  name: slavery-secrets
  namespace: slavery
  labels:
    app.kubernetes.io/name: slavery-js
type: Opaque
# stringData values are base64-encoded automatically by kubectl apply.
# In production, inject these via Vault / Sealed Secrets / AWS Secrets Manager
# rather than committing them here.
stringData:
  REDIS_URL: "redis://redis-service:6379"
  # REDIS_PASSWORD: ""     # Uncomment if Redis has auth enabled
  # OTHER_SECRET: ""
