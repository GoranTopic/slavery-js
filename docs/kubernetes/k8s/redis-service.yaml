apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: slavery
  labels:
    app: redis
    app.kubernetes.io/name: slavery-js
    app.kubernetes.io/component: redis
spec:
  clusterIP: None          # Headless service required by StatefulSet
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
