apiVersion: apps/v1
kind: Deployment
metadata:
  name: slavery-api
  namespace: slavery
  labels:
    app: slavery-api
    app.kubernetes.io/name: slavery-js
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: slavery-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: slavery-api
        app.kubernetes.io/name: slavery-js
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      terminationGracePeriodSeconds: 30
      # Drop all Linux capabilities at the pod level; containers opt in explicitly.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532        # distroless nonroot uid
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [slavery-api]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: slavery-js/api:local
          imagePullPolicy: Always
          args: ["--enable-source-maps", "dist/distributed/api-server.js"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: slavery-config
            - secretRef:
                name: slavery-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              # distroless has no shell — sleep is called directly
              exec:
                command: ["sleep", "5"]
