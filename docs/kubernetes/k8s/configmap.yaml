apiVersion: v1
kind: ConfigMap
metadata:
  name: slavery-config
  namespace: slavery
  labels:
    app.kubernetes.io/name: slavery-js
data:
  # ── Shared ──────────────────────────────────────────────────────────────────
  SERVICE_NAME: "slavery-example"
  NODE_ENV: "production"
  LOG_LEVEL: "info"

  # ── API service ──────────────────────────────────────────────────────────────
  PORT: "3000"
  TIMEOUT_MS: "30000"

  # ── Worker ───────────────────────────────────────────────────────────────────
  WORKER_CONCURRENCY: "2"
  HEALTH_PORT: "3001"
