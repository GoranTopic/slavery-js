apiVersion: v1
kind: Service
metadata:
  name: slavery-api
  namespace: slavery
  labels:
    app: slavery-api
    app.kubernetes.io/name: slavery-js
    app.kubernetes.io/component: api
spec:
  # Change to LoadBalancer or use an Ingress controller for external access.
  type: ClusterIP
  selector:
    app: slavery-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
